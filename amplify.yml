# Redirects: Amplify Console → App → Hosting → Rewrites and redirects → Edit → pegar AMPLIFY_REDIRECTS.json
# Regla 404-200 (no 200) para que /pdf.js/* se sirva como archivo; si es 200, todo recibe index.html → MIME text/html.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use || true
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
